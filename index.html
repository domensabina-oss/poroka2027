<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="meta_title">Dom &amp; Sabina</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-row">
      <a class="brand" href="#home" data-i18n="couple_names"></a>
      <div class="lang-switch" role="group" data-i18n-aria-label="lang_switch_label">
        <button type="button" data-lang="sl" data-i18n="lang_sl"></button>
        <button type="button" data-lang="en" data-i18n="lang_en"></button>
      </div>
    </div>
    <nav class="site-nav" data-i18n-aria-label="nav_label">
      <a href="#programme" data-i18n="nav_programme"></a>
      <a href="#venue" data-i18n="nav_venue"></a>
      <a href="#accommodation" data-i18n="nav_accommodation"></a>
      <a href="#faq" data-i18n="nav_faq"></a>
      <a href="#rsvp" data-i18n="nav_rsvp"></a>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <p class="kicker" data-i18n="hero_kicker"></p>
      <h1 data-i18n="couple_names"></h1>
      <p class="hero-meta" data-i18n="hero_date_place"></p>

      <div class="status" aria-live="polite">
        <p data-show="loading" hidden data-i18n="loading"></p>
        <div data-show="error" hidden>
          <p data-i18n="error_load"></p>
          <button type="button" id="retry" class="btn" data-i18n="retry"></button>
        </div>
        <p data-show="no-token" hidden class="notice" data-i18n="no_token"></p>
        <p data-show="invalid" hidden class="notice" data-i18n="invalid_token"></p>
        <div data-show="ok" hidden class="welcome">
          <p id="greeting" class="greeting"></p>
          <p data-i18n="invite_for"></p>
          <ul id="guest-list" class="guest-list"></ul>
        </div>
      </div>
    </section>

    <section id="programme">
      <h2 data-i18n="programme_title"></h2>
      <article class="card" data-show="sat">
        <h3 data-i18n="sat_title"></h3>
        <p data-i18n="sat_desc"></p>
        <p class="soon" data-i18n="sat_time"></p>
      </article>
      <article class="card" data-show="sun" hidden>
        <h3 data-i18n="sun_title"></h3>
        <p data-i18n="sun_desc"></p>
        <p class="soon" data-i18n="sun_time"></p>
      </article>
    </section>

    <section id="venue">
      <h2 data-i18n="venue_title"></h2>
      <article class="card" data-show="sat">
        <h3 data-i18n="venue_sat_title"></h3>
        <p class="soon" data-i18n="venue_sat"></p>
      </article>
      <article class="card" data-show="sun" hidden>
        <h3 data-i18n="venue_sun_title"></h3>
        <p class="soon" data-i18n="venue_sun"></p>
      </article>
    </section>

    <section id="accommodation">
      <h2 data-i18n="acc_title"></h2>
      <p data-i18n="acc_text"></p>
      <p data-i18n="acc_help"></p>
    </section>

    <section id="faq">
      <h2 data-i18n="faq_title"></h2>
      <dl class="faq">
        <dt data-i18n="faq_dress_q"></dt>
        <dd class="soon" data-i18n="faq_dress_a"></dd>
        <dt data-i18n="faq_kids_q"></dt>
        <dd>
          <p data-show="sat" data-i18n="faq_kids_sat"></p>
          <p data-show="sun" hidden data-i18n="faq_kids_sun"></p>
        </dd>
        <dt data-i18n="faq_contact_q"></dt>
        <dd class="soon" data-i18n="faq_contact_a"></dd>
      </dl>
    </section>

    <section id="rsvp">
      <h2 data-i18n="rsvp_title"></h2>
      <p data-show="ok" hidden class="soon" data-i18n="rsvp_soon"></p>
      <p data-show="not-ok" hidden class="notice" data-i18n="rsvp_need_link"></p>
    </section>
  </main>

  <footer class="site-footer">
    <p data-i18n="couple_names"></p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
