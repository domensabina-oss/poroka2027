              </fieldset>

              <div class="block">
                <label class="text"><span class="label-strong" data-i18n="allergies_label"></span>
                  <span class="hint" id="allergies-hint" data-i18n-n="allergies_hint"></span>
                  <textarea id="allergies" rows="2" maxlength="1000" data-i18n-placeholder="allergies_ph"></textarea>
                </label>
              </div>

              <fieldset class="block">
                <legend data-i18n="songs_title"></legend>
                <div id="song-rows"></div>
                <button type="button" id="add-song" class="btn-link" data-i18n="song_add"></button>
              </fieldset>

              <fieldset class="block" id="acc-block">
                <legend data-i18n-n="acc_q"></legend>
                <div class="choices">
                  <label class="choice"><input type="radio" name="acc" value="yes"><span data-i18n="yes"></span></label>
                  <label class="choice"><input type="radio" name="acc" value="no"><span data-i18n="no"></span></label>
                </div>
                <p class="field-error" id="err-acc" hidden data-i18n="err_choose"></p>
                <div id="acc-details" hidden>
                  <label class="text"><span data-i18n="acc_people"></span>
                    <input type="number" id="acc-people" min="1" max="50" step="1" inputmode="numeric">
                  </label>
                  <p class="field-error" id="err-acc-people" hidden data-i18n="err_people"></p>
                  <label class="text"><span data-i18n="acc_notes"></span>
                    <textarea id="acc-notes" rows="2" maxlength="1000"></textarea>
                  </label>
                </div>
              </fieldset>
            </div>

            <div class="block">
              <label class="text"><span class="label-strong" data-i18n="message_label"></span>
                <textarea id="message" rows="3" maxlength="2000"></textarea>
              </label>
            </div>

            <p class="privacy" data-i18n="privacy_note"></p>
            <button type="submit" class="btn" id="submit-btn" data-i18n="submit"></button>
            <p id="submit-status" class="submit-status" role="status"></p>
          </form>

          <div id="rsvp-done" data-show="done" hidden class="done">
            <svg class="branch small" aria-hidden="true"><use href="#olive"/></svg>
            <p class="done-title" id="done-title"></p>
            <p id="done-text"></p>
            <p class="muted" id="done-deadline" hidden></p>
            <button type="button" class="btn btn-outline" id="edit-again" data-i18n="done_edit"></button>
          </div>
        </div>

      </div>
    </section>

    <template id="tpl-song">
      <div class="song">
        <label class="text"><span data-i18n="song_artist"></span><input type="text" class="artist" maxlength="100"></label>
        <label class="text"><span data-i18n="song_title"></span><input type="text" class="title" maxlength="100"></label>
        <button type="button" class="btn-link remove" data-i18n="song_remove"></button>
      </div>
    </template>
  </main>

  <footer class="site-footer">
    <svg class="branch small" aria-hidden="true"><use href="#olive"/></svg>
    <p data-i18n="couple_names"></p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
